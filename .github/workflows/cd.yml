name: Ru-Beacon CD Pipeline (Semantic Release)

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-images:
    name: Build & Push GHCR Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-service, bot-service, workflow-worker]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner for Docker Tag
        id: repo_owner
        run: echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build & Push Image (${{ matrix.service }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/ru-beacon-${{ matrix.service }}:${{ github.ref_name }}
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/ru-beacon-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package-helm:
    name: Helm Chart Package & Validation
    runs-on: ubuntu-latest
    needs: build-and-push-images
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.3'

      - name: Lint Helm Chart
        run: helm lint deploy/helm/ru-beacon

      - name: Package Helm Chart
        run: |
          mkdir -p dist
          CLEAN_VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          helm package deploy/helm/ru-beacon --version "${CLEAN_VERSION}" --app-version "${CLEAN_VERSION}" -d dist/

  notify-discord:
    name: Discord CD Notification
    runs-on: ubuntu-latest
    needs: [build-and-push-images, package-helm]
    if: always()
    steps:
      - name: Lowercase Repository Owner
        id: repo_owner
        run: echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Send Discord Release Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "🚀 Ru-Beacon 릴리스 배포 (${{ github.ref_name }})"
          description: |
            **Release Tag**: `${{ github.ref_name }}`
            **Author**: ${{ github.actor }}
            **Registry**: `ghcr.io/${{ steps.repo_owner.outputs.owner }}`
            - `ru-beacon-api-service:${{ github.ref_name }}`
            - `ru-beacon-bot-service:${{ github.ref_name }}`
            - `ru-beacon-workflow-worker:${{ github.ref_name }}`
            **Helm Chart**: `deploy/helm/ru-beacon` 패키징 완료
          nodetail: false

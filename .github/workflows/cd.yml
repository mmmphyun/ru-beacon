name: Ru-Beacon CD Pipeline (Semantic Release)

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-push-images:
    name: Build & Push GHCR Images
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        include:
          - name: api
            context: .
            file: ./api-service/Dockerfile
          - name: bot
            context: .
            file: ./bot-service/Dockerfile
          - name: worker
            context: .
            file: ./workflow-worker/Dockerfile
          - name: web
            context: ./web-dashboard
            file: ./web-dashboard/Dockerfile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner for Docker Tag
        id: repo_owner
        run: echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build & Push Image (${{ matrix.name }})
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/ru-beacon-${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/ru-beacon-${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-plugin:
    name: Build & Release Minecraft Plugin
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Plugin JAR
        run: |
          chmod +x gradlew
          ./gradlew :minecraft-plugin:jar --no-daemon
          mkdir -p release-artifacts
          cp minecraft-plugin/build/libs/*.jar release-artifacts/ru-beacon-plugin.jar

      - name: Upload Plugin to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/ru-beacon-plugin.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-helm:
    name: Helm Chart Package & Validation
    runs-on: ubuntu-latest
    needs: [build-and-push-images, release-plugin]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.3'

      - name: Lint Helm Chart
        run: helm lint deploy/helm/ru-beacon

      - name: Package Helm Chart
        run: |
          mkdir -p dist
          CLEAN_VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          helm package deploy/helm/ru-beacon --version "${CLEAN_VERSION}" --app-version "${CLEAN_VERSION}" -d dist/

  notify-discord:
    name: Discord CD Notification
    runs-on: ubuntu-latest
    needs: [build-and-push-images, release-plugin, package-helm]
    if: always()
    steps:
      - name: Lowercase Repository Owner
        id: repo_owner
        run: echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Send Discord Release Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "🚀 Ru-Beacon 릴리스 배포 (${{ github.ref_name }})"
          description: |
            **Release Tag**: `${{ github.ref_name }}`
            **Author**: ${{ github.actor }}
            **Registry**: `ghcr.io/${{ steps.repo_owner.outputs.owner }}`
            - `ru-beacon-api:${{ github.ref_name }}`
            - `ru-beacon-bot:${{ github.ref_name }}`
            - `ru-beacon-worker:${{ github.ref_name }}`
            - `ru-beacon-web:${{ github.ref_name }}`
            **Plugin Release**: `ru-beacon-plugin.jar` 첨부 완료
            **Helm Chart**: `deploy/helm/ru-beacon` 패키징 완료
          nodetail: false

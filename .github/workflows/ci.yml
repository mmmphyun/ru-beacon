name: Ru-Beacon CI Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'api-service/**'
      - 'bot-service/**'
      - 'workflow-worker/**'
      - 'minecraft-plugin/**'
      - 'common/**'
      - 'web-dashboard/**'
      - 'deploy/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/ci.yml'
      - 'scripts/**'
      - '.gitleaks.toml'
  pull_request:
    branches:
      - main
    paths:
      - 'api-service/**'
      - 'bot-service/**'
      - 'workflow-worker/**'
      - 'minecraft-plugin/**'
      - 'common/**'
      - 'web-dashboard/**'
      - 'deploy/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/ci.yml'
      - 'scripts/**'
      - '.gitleaks.toml'

jobs:
  security-check:
    name: Secrets & Public IP Leak Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Grant execute permission for scripts
        run: chmod +x scripts/*.sh

      - name: Public IPv4 Leak Guard
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF_TARGET="origin/${{ github.base_ref }}...HEAD"
          else
            if [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              DIFF_TARGET="HEAD~1...HEAD"
            else
              DIFF_TARGET="${{ github.event.before }}...${{ github.sha }}"
            fi
          fi
          ./scripts/check-public-ip.sh "$DIFF_TARGET"

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  test:
    name: Gradle Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Gradle Test Suite
        run: ./gradlew test --no-daemon --stacktrace

  frontend-check:
    name: Frontend Build & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-dashboard
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '12'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Frontend Tests
        run: pnpm test

      - name: Build Next.js Dashboard
        run: pnpm build

  docker-build-check:
    name: Multi-Stage Docker Image Build Check
    needs: [test, frontend-check]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api-service
            context: .
            file: ./api-service/Dockerfile
          - service: bot-service
            context: .
            file: ./bot-service/Dockerfile
          - service: workflow-worker
            context: .
            file: ./workflow-worker/Dockerfile
          - service: web-dashboard
            context: ./web-dashboard
            file: ./web-dashboard/Dockerfile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (${{ matrix.service }})
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: rubeacon/${{ matrix.service }}:ci-check

  helm-lint:
    name: Helm Chart Lint & Validation
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.3'

      - name: Lint Helm Chart
        run: helm lint deploy/helm/ru-beacon

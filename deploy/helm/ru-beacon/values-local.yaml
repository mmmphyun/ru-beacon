global:
  environment: local
  timezone: Asia/Seoul

config:
  databaseUrl: "jdbc:postgresql://postgres-postgresql.database.svc.cluster.local:5432/rubeacon"
  databaseUser: "rubeacon_app"
  redisHost: "redis-master.database.svc.cluster.local"
  redisPort: "6379"

secrets:
  databasePassword: "change_me_prod_db_secret"
  discordBotToken: "local_mock_token_for_e2e_testing"

apiService:
  enabled: true
  replicaCount: 1
  image:
    repository: ru-beacon-api
    tag: local
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi

botService:
  enabled: true
  replicaCount: 1
  image:
    repository: ru-beacon-bot
    tag: local
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

workflowWorker:
  enabled: true
  replicaCount: 1
  image:
    repository: ru-beacon-worker
    tag: local
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
  keda:
    enabled: false

webDashboard:
  enabled: true
  replicaCount: 1
  image:
    repository: ru-beacon-web
    tag: local
    pullPolicy: IfNotPresent
  apiUrl: "http://api.127.0.0.1.nip.io"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "ru-beacon-api"
  host: api.127.0.0.1.nip.io
  webHost: web.127.0.0.1.nip.io
  tls: []

podDisruptionBudget:
  enabled: false

serviceMonitor:
  enabled: false

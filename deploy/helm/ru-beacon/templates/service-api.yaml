{{- if .Values.apiService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: ru-beacon-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.apiService.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: ru-beacon-api
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

{{- if and .Values.ingress.enabled (eq .Values.ingress.className "traefik") }}
{{- if .Values.ingress.redirectHttps }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-redirect-https
  labels:
    app.kubernetes.io/name: ru-beacon
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
{{- end }}
{{- if .Values.ingress.cloudflareOnly }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-cloudflare-shield
  labels:
    app.kubernetes.io/name: ru-beacon
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  ipWhiteList:
    sourceRange:
      # Cloudflare Official IPv4 CIDRs
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
      # Cloudflare Official IPv6 CIDRs
      - 2400:cb00::/32
      - 2606:4700::/32
      - 2803:f800::/32
      - 2405:b500::/32
      - 2405:8100::/32
      - 2a06:98c0::/29
      - 2c0f:f248::/32
{{- end }}
{{- end }}

{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  labels:
    app.kubernetes.io/name: ru-beacon
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and (eq .Values.ingress.className "traefik") (or .Values.ingress.redirectHttps .Values.ingress.cloudflareOnly) }}
    {{- $middlewares := list }}
    {{- if .Values.ingress.redirectHttps }}
    {{- $middlewares = append $middlewares (printf "%s-%s-redirect-https@kubernetescrd" (default "default" .Release.Namespace) .Release.Name) }}
    {{- end }}
    {{- if .Values.ingress.cloudflareOnly }}
    {{- $middlewares = append $middlewares (printf "%s-%s-cloudflare-shield@kubernetescrd" (default "default" .Release.Namespace) .Release.Name) }}
    {{- end }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," $middlewares | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.apiService.enabled }}
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  number: {{ .Values.apiService.port }}
    {{- end }}
    {{- if .Values.webDashboard.enabled }}
    - host: {{ .Values.ingress.webHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-web
                port:
                  number: {{ .Values.webDashboard.port }}
    {{- end }}
{{- end }}

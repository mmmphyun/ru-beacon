global:
  environment: production
  timezone: Asia/Seoul

config:
  databaseUrl: "jdbc:postgresql://postgres-postgresql.database.svc.cluster.local:5432/rubeacon"
  databaseUser: "rubeacon_app"
  redisHost: "redis-master.database.svc.cluster.local"
  redisPort: "6379"
  enableSimulation: "true"

secrets:
  databasePassword: "change_me_prod_db_secret"
  discordBotToken: "change_me_prod_bot_token"

apiService:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/mmmphyun/ru-beacon-api
    tag: latest
    pullPolicy: Always
  port: 8080

botService:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/mmmphyun/ru-beacon-bot
    tag: latest
    pullPolicy: Always

workflowWorker:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/mmmphyun/ru-beacon-worker
    tag: latest
    pullPolicy: Always
  keda:
    enabled: true
    minReplicaCount: 2
    maxReplicaCount: 6

webDashboard:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/mmmphyun/ru-beacon-web
    tag: latest
    pullPolicy: Always
  port: 3000
  apiUrl: "http://api.rubeacon.internal"

ingress:
  enabled: true
  className: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
  host: "api.rubeacon.internal"
  webHost: "dashboard.rubeacon.internal"
  tls: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: false
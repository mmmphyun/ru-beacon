global:
  environment: production
  timezone: Asia/Seoul

config:
  databaseUrl: "jdbc:postgresql://postgres-postgresql.database.svc.cluster.local:5432/rubeacon"
  databaseUser: "rubeacon_app"
  redisHost: "redis-master.database.svc.cluster.local"
  redisPort: "6379"

secrets:
  databasePassword: "change_me_prod_db_secret"
  discordBotToken: "change_me_prod_bot_token"

apiService:
  enabled: true
  # 초기 K3s/소형 단일 노드 배포 시 WSS 세션 레지스트리 단일화(정합성 100%)를 위해 1로 운영 권장
  # 2대 이상 확장 시 ingress.annotations에 upstream-hash-by 또는 sticky session 필요
  replicaCount: 1
  image:
    repository: ghcr.io/mmmphyun/ru-beacon-api
    tag: 1.0.0
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5

botService:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/mmmphyun/ru-beacon-bot
    tag: 1.0.0
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

workflowWorker:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/mmmphyun/ru-beacon-worker
    tag: 1.0.0
    pullPolicy: IfNotPresent
  metricsPort: 8081
  terminationGracePeriodSeconds: 30
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8081
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /healthz
      port: 8081
    initialDelaySeconds: 10
    periodSeconds: 5
  keda:
    enabled: true
    minReplicaCount: 2
    maxReplicaCount: 10
    lagThreshold: 100
    pollingInterval: 15
    cooldownPeriod: 60

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "ru-beacon-api"
    # 다중 API 파드(replicaCount >= 2) 확장 시 WSS 세션 고정을 위한 테넌트 해시 라우팅:
    # nginx.ingress.kubernetes.io/upstream-hash-by: "$http_x_tenant_id"
  host: api.rubeacon.internal
  tls: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s

global:
  environment: production
  timezone: Asia/Seoul

config:
  databaseUrl: "jdbc:postgresql://postgres-postgresql.database.svc.cluster.local:5432/rubeacon"
  databaseUser: "rubeacon_app"
  redisHost: "redis-master.database.svc.cluster.local"
  redisPort: "6379"

secrets:
  databasePassword: "change_me_prod_db_secret"
  discordBotToken: "change_me_prod_bot_token"

apiService:
  enabled: true
  # Batch 1의 Redis Pub/Sub 분산 세션 라우팅이 구현되어 Pod 위치와 무관하게 명령어 전달 가능하므로 다중 파드 기본 확장 지원
  replicaCount: 2
  image:
    repository: ghcr.io/mmmphyun/ru-beacon-api
    tag: 1.0.0
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5

botService:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/mmmphyun/ru-beacon-bot
    tag: 1.0.0
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

workflowWorker:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/mmmphyun/ru-beacon-worker
    tag: 1.0.0
    pullPolicy: IfNotPresent
  metricsPort: 8081
  terminationGracePeriodSeconds: 30
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8081
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /healthz
      port: 8081
    initialDelaySeconds: 10
    periodSeconds: 5
  keda:
    enabled: true
    minReplicaCount: 2
    maxReplicaCount: 10
    lagThreshold: 100
    pollingInterval: 15
    cooldownPeriod: 60

webDashboard:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/mmmphyun/ru-beacon-web
    tag: 1.0.0
    pullPolicy: IfNotPresent
  port: 3000
  apiUrl: "http://api.rubeacon.internal"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  livenessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 5

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "ru-beacon-api"
    # Redis Pub/Sub 분산 세션 라우팅 덕분에 강제 Sticky Session 없이도 정상 동작하나,
    # L7 세션 친화성 및 불필요한 브로드캐스트 최소화를 위한 테넌트 해시 라우팅 옵션:
    # nginx.ingress.kubernetes.io/upstream-hash-by: "$http_x_tenant_id"
  host: api.rubeacon.internal
  webHost: dashboard.rubeacon.internal
  tls: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s
